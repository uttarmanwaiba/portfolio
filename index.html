<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Waiba's Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Yu Gothic", sans-serif;
    background:linear-gradient(135deg,#f4f6f9,#e8eef5);
}

h1{
    height:150px;
    color:white;
    background:linear-gradient(135deg,#0057b8,#4a90ff);
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
    font-size:40px;
    letter-spacing:2px;
}

ul{
    list-style:none;
    padding:15px 0;
    margin:0;
    background:#444;
    text-align:center;
}

li{
    display:inline-block;
    margin:0 25px;
}

a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

a:hover{
    color:#ffd700;
}

.c1{
    text-align:center;
    margin:50px 0;
}

.profile-frame{
    position:relative;
    width:280px;
    margin:auto;
    animation:fadeInUp 1.2s ease-out;
}

.profile-frame img{
    width:100%;
    height:350px;
    object-fit:cover;
    display:block;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.6);
    transition:0.4s;
}

.profile-frame img:hover{
    transform:translateY(-10px) scale(1.03);
}

.box{
    position:absolute;
    width:50px;
    height:50px;
    animation:cornerGlow 2.5s infinite alternate;
}

.top-left{
    top:-10px;
    left:-10px;
    border-top:5px solid #0057b8;
    border-left:5px solid #0057b8;
}

.top-right{
    top:-10px;
    right:-10px;
    border-top:5px solid #0057b8;
    border-right:5px solid #0057b8;
}

.bottom-left{
    bottom:-10px;
    left:-10px;
    border-bottom:5px solid #0057b8;
    border-left:5px solid #0057b8;
}

.bottom-right{
    bottom:-10px;
    right:-10px;
    border-bottom:5px solid #0057b8;
    border-right:5px solid #0057b8;
}

h2{
    border-bottom:3px solid #b11226;
    width:90%;
    margin:20px auto;
    padding-bottom:10px;
}

.c2{
    background:white;
    width:90%;
    margin:20px auto;
    padding:25px;
    border-radius:12px;
    box-shadow:0 6px 15px rgba(0,0,0,0.15);

    opacity:0;
    transform:translateY(40px);
    animation:slideUp 1s forwards;
}

.c2:nth-of-type(1){
    animation-delay:0.3s;
}

.c2:nth-of-type(2){
    animation-delay:0.6s;
}

.c2:nth-of-type(3){
    animation-delay:0.9s;
}

.c2:hover{
    transform:translateY(-5px);
}

h3{
    color:#0057b8;
    margin-bottom:10px;
}


@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(80px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes cornerGlow{
    from{
        opacity:0.5;
    }
    to{
        opacity:1;
    }
}
</style>

</head>

<body>
